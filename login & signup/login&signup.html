<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512'><path fill='%232563eb' d='M21.5 181.1L78.3 67.4C89.2 45.7 111.3 32 135.6 32l304.9 0c24.2 0 46.4 13.7 57.2 35.4l56.8 113.7c3.6 7.2 5.5 15.1 5.5 23.2 0 27.3-21.2 49.7-48 51.6L512 448c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-192-96 0 0 176c0 26.5-21.5 48-48 48l-192 0c-26.5 0-48-21.5-48-48l0-176.1c-26.8-1.9-48-24.3-48-51.6 0-8 1.9-16 5.5-23.2zM128 256l0 112c0 8.8 7.2 16 16 16l128 0c8.8 0 16-7.2 16-16l0-112-160 0z'/></svg>">
    
    <link href="https://unpkg.com/@csstools/normalize.css" rel="stylesheet" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <title>Login & Sign Up - Market Hammad</title>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1 class="logo"><i class="fa-solid fa-shop"></i> Market Hammad</h1>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <div class="toggle-box">
            <button id="login_toggle_btn" class="toggle-btn active">Login</button>
            <button id="signup_toggle_btn" class="toggle-btn">Sign Up</button>
        </div>

        <form id="login_form" class="auth-form active">
            <div class="input-group">
                <label for="login_email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="login_email" placeholder="name@example.com">
                </div>
            </div>

            <div class="input-group">
                <label for="login_password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login_password" placeholder="••••••••">
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>

            <button type="submit" id="login-btn" class="submit-btn">Sign In</button>
        </form>

        <form id="signup_form" class="auth-form">
            <div class="input-group">
                <label for="signup_name">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="signup_name" placeholder="John Doe" >
                </div>
            </div>

            <div class="input-group">
                <label for="signup_email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="signup_email" placeholder="name@example.com">
                </div>
            </div>

            <div class="input-group">
                <label for="signup_password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signup_password" placeholder="Create a strong password" >
                </div>
            </div>

            <button type="submit" id="signup-btn" class="submit-btn">Create Account</button>
        </form>

        <a href="../" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
